name: Angular Build Workflow

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install
        working-directory: git-github-practice/19-angular-build-workflow/angular-app

      - name: Build Angular App
        run: npm run build
        working-directory: git-github-practice/19-angular-build-workflow/angular-app
